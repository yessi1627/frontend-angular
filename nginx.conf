server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular maneja las rutas en el navegador (/tareas, /restablecer?token=...):
  # si el archivo no existe devuelvo index.html para que el router de Angular la resuelva
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos con hash en el nombre no cambian nunca: el navegador los puede guardar un año
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html siempre se pide de nuevo para que un despliegue nuevo se vea de inmediato
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
