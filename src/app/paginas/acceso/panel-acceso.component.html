<div class="pagina">
  <span class="forma forma-1" aria-hidden="true"></span>
  <span class="forma forma-2" aria-hidden="true"></span>
  <span class="forma forma-3" aria-hidden="true"></span>

  <button
    type="button"
    class="btn btn-icono tema"
    (click)="tema.alternar()"
    [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  >
    <i class="bi fs-5" [class]="tema.tema() === 'oscuro' ? 'bi bi-sun' : 'bi bi-moon-stars'"></i>
  </button>

  <main class="tarjeta-acceso">
    <section class="lado-ilustracion">
      <div class="marca">
        <span class="marca-logo"><i class="bi bi-mortarboard-fill"></i></span>
        <strong>SIULT</strong>
      </div>
      <app-ilustracion-biblioteca />
      <div class="mensajes" aria-live="polite">
        <p class="mensaje">{{ mensajes[actual()] }}</p>
        <div class="puntos">
          @for (m of mensajes; track $index) {
            <span [class.activo]="$index === actual()"></span>
          }
        </div>
      </div>
    </section>

    <section class="lado-formulario">
      <ng-content />
    </section>
  </main>
</div>
